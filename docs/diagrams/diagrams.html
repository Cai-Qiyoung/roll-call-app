<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>图表：类图 · 流程图 · 性能分析</title>
<style>
  body { background: #ece9f4; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft Yahei", sans-serif; margin: 0; }

</head>
<body>

<!-- ================= 类图 ================= -->

<!-- ================= 流程图1：随机点名主流程 ================= -->
<div class="diagram" id="d2">
  <div class="d-title">算法流程图①：随机点名与积分主流程</div>
  <svg width="760" height="830" viewBox="0 0 760 830">
    <defs>
      <marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker>
    </defs>
    <g font-size="13.5" fill="#333" text-anchor="middle">
      <!-- 开始 -->
      <rect x="300" y="16" width="160" height="44" rx="22" fill="#00c2a8"/>
      <text x="380" y="44" fill="#fff" font-weight="700">开始：点击「开始点名」</text>
      <line x1="380" y1="60" x2="380" y2="86" stroke="#555" stroke-width="1.6" marker-end="url(#a1)"/>

      <rect x="300" y="88" width="160" height="44" rx="10" fill="#fff3e9" stroke="#ff9a3c"/>
      <text x="380" y="115">前端滚动动画 1.4s</text>
      <line x1="380" y1="132" x2="380" y2="152" stroke="#555" stroke-width="1.6" marker-end="url(#a1)"/>

      <!-- 承办空判断 -->
      <polygon points="380,154 468,192 380,230 292,192" fill="#fff" stroke="#ff6b35" stroke-width="1.6"/>
      <text x="380" y="195">名单为空？</text>
      <text x="452" y="186" font-size="12" fill="#ee0a24">是</text>
      <text x="452" y="216" font-size="12" fill="#00a3c2">否</text>
      <line x1="468" y1="192" x2="556" y2="192" stroke="#555" stroke-width="1.6" marker-end="url(#a1)"/>
      <line x1="380" y1="230" x2="380" y2="258" stroke="#555" stroke-width="1.6" marker-end="url(#a1)"/>

      <!-- 空名单分支 -->
      <rect x="560" y="170" width="164" height="44" rx="10" fill="#ffe9e9" stroke="#ee0a24"/>
      <text x="642" y="197">提示去「名单」页导入</text>
      <line x1="642" y1="214" x2="642" y2="240" stroke="#555" stroke-width="1.6" marker-end="url(#a1)"/>
      <rect x="580" y="242" width="124" height="40" rx="20" fill="#d8d5e8"/>
      <text x="642" y="267">结束</text>

      <!-- 权重计算 -->
      <rect x="300" y="260" width="160" height="44" rx="10" fill="#fff3e9" stroke="#ff9a3c"/>
      <text x="380" y="287">计算权重 w = 1/(1+score)</text>
      <line x1="380" y1="304" x2="380" y2="324" stroke="#555" stroke-width="1.6" marker-end="url(#a1)"/>

      <!-- 疯狂星期四判断 -->
      <polygon points="380,326 468,364 380,402 292,364" fill="#fff" stroke="#ff6b35" stroke-width="1.6"/>
      <text x="380" y="367">疯狂星期四？</text>
      <text x="452" y="358" font-size="12" fill="#ee0a24">是</text>
      <text x="452" y="388" font-size="12" fill="#00a3c2">否</text>
      <line x1="468" y1="364" x2="540" y2="364" stroke="#555" stroke-width="1.6" marker-end="url(#a1)"/>
      <line x1="380" y1="402" x2="380" y2="430" stroke="#555" stroke-width="1.6" marker-end="url(#a1)"/>

      <rect x="544" y="342" width="180" height="44" rx="10" fill="#fff3e9" stroke="#ff9a3c"/>
      <text x="634" y="369">score 为 50 倍数者权重 ×3</text>
      <path d="M634,386 L634,412 Q634,422 624,422 L412,422 Q402,422 402,432" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a1)"/>

      <!-- 抽取 -->

      <text x="380" y="461">random.choices 加权抽取</text>
      <line x1="380" y1="478" x2="380" y2="498" stroke="#555" stroke-width="1.6" marker-end="url(#a1)"/>

      <rect x="300" y="500" width="160" height="56" rx="10" fill="#fff3e9" stroke="#ff9a3c"/>
      <text x="380" y="524">累计点名次数 roll_count+1</text>
      <text x="380" y="543">每被点 2 次 → 转移权 +1</text>
      <line x1="380" y1="556" x2="380" y2="576" stroke="#555" stroke-width="1.6" marker-end="url(#a1)"/>

      <rect x="300" y="578" width="160" height="44" rx="10" fill="#eef0ff" stroke="#7c4dff"/>
      <text x="380" y="605">随机事件：🔥8% · ⭐8%</text>
      <line x1="380" y1="622" x2="380" y2="642" stroke="#555" stroke-width="1.6" marker-end="url(#a1)"/>

      <rect x="300" y="644" width="160" height="44" rx="22" fill="#00c2a8"/>
      <text x="380" y="671" fill="#fff" font-weight="700">展示被点学生 + 事件</text>
      <line x1="380" y1="688" x2="380" y2="714" stroke="#555" stroke-width="1.6" marker-end="url(#a1)"/>

      <circle cx="380" cy="732" r="20" fill="#ff6b35" stroke="#fff" stroke-width="3"/>
      <text x="380" y="738" fill="#fff" font-weight="700">A</text>
      <text x="380" y="788" font-size="13" fill="#666">A：老师操作 → 到场确认 / 缺席 / 免点券 / 转移 → 答题计分（见流程图②）</text>
    </g>
  </svg>
</div>

<!-- ================= 流程图2：答题计分规则 ================= -->

      <line x1="380" y1="250" x2="380" y2="270" stroke="#555" stroke-width="1.6" marker-end="url(#a1)"/>

<!-- ================= 性能分析图 ================= -->
<div class="diagram" id="d4">
  <div class="d-title">性能分析：三种抽样方案实测对比（50 名学生 × 20 万次）</div>
  <svg width="760" height="420" viewBox="0 0 760 420">
    <g font-size="14" fill="#333">
      <!-- y 轴参考 -->
      <line x1="170" y1="70" x2="170" y2="330" stroke="#ccc" stroke-width="1"/>
      <line x1="170" y1="330" x2="730" y2="330" stroke="#ccc" stroke-width="1"/>
      <text x="120" y="336" font-size="13" fill="#888" text-anchor="middle">吞吐量</text>
      <text x="120" y="352" font-size="13" fill="#888" text-anchor="middle">（万次/秒）</text>

      <!-- 刻度（0 ~ 1500 万次/秒） -->
      <g font-size="11" fill="#999" text-anchor="middle">
        <line x1="180" y1="322" x2="180" y2="338" stroke="#999"/>
        <text x="180" y="354">0</text>
        <line x1="360" y1="322" x2="360" y2="338" stroke="#999"/>
        <text x="360" y="354">500</text>
        <line x1="540" y1="322" x2="540" y2="338" stroke="#999"/>
        <text x="540" y="354">1000</text>
        <line x1="720" y1="322" x2="720" y2="338" stroke="#999"/>
        <text x="720" y="354">1500</text>
      </g>

      <!-- row1 1041/1500*540=375 -->
      <text x="168" y="112" font-size="13.5" text-anchor="end">普通随机 O(1)</text>
      <rect x="180" y="88" width="375" height="46" rx="8" fill="#c9c3d9"/>
      <text x="571" y="117" font-size="14" font-weight="700" fill="#555">1041 万次/秒</text>

      <!-- row2 39/1500*540=14 -->
      <text x="168" y="202" font-size="13.5" text-anchor="end">加权 O(n) choices</text>
      <rect x="180" y="176" width="14" height="46" rx="8" fill="#ff9a3c"/>
      <text x="210" y="205" font-size="14" font-weight="700" fill="#ee0a24">39 万次/秒（慢 26 倍）</text>

      <!-- row3 1315/1500*540=473 -->
      <text x="168" y="300" font-size="13.5" text-anchor="end">前缀和+二分 O(log n)</text>
      <rect x="180" y="270" width="473" height="46" rx="8" fill="#7c4dff"/>
      <text x="669" y="299" font-size="14" font-weight="700" fill="#7c4dff">1315 万次/秒（快 33 倍）</text>

      <text x="170" y="386" font-size="13" fill="#666">结论：random.choices 每次调用重建权重列表 O(n)，cProfile 热点为权重列表推导（约 79% 耗时）。</text>
      <text x="170" y="406" font-size="13" fill="#666">改进：预计算前缀和 + random()×total + bisect（O(log n)），仅在积分变化时重建缓存，实测提速约 33 倍。</text>
    </g>
  </svg>
</div>

</body>
